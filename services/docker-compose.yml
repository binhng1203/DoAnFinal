version: '3.9'
services:
  # ============================================================
  # 1. SHARED DATABASE
  # ============================================================
  system_db:
    image: postgres:16
    container_name: system_db_final
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: final
      TZ: Asia/Bangkok
    ports:
      - "5432:5432"
    volumes:
      - pgdata_shared:/var/lib/postgresql/data
      # Quan trọng: Phải có file 01_init_multidb.sql ở đây
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d final" ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app-network

  db-init:
    image: postgres:16
    container_name: db_init_final
    depends_on:
      system_db:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./db/init:/init-sql
    command: >
      bash -c "
        echo 'Running DB init script...' &&
        psql -h system_db -U postgres -d final -f /init-sql/01-init.sql &&
        echo 'DB init done'
      "
    networks:
      - app-network
    restart: "no"

  # ============================================================
  # 2. WEB SERVICES GROUP
  # ============================================================
  user-service:
    build: ./user_service
    container_name: user_service_app
    env_file: ./user_service/.env
    environment:
      # nếu .env đã tự khai báo DATABASE_URL thì có thể bỏ dòng dưới
      - DATABASE_URL=postgresql://postgres:postgres@system_db:5432/final
      - FLASK_APP=run.py
      - FLASK_DEBUG=1
    depends_on:
      system_db:
        condition: service_healthy
    ports:
      - "8001:8000"
    volumes:
      - ./user_service:/app
    command: >
      sh -c " flask db upgrade &&  gunicorn -w 2 -b 0.0.0.0:8000 run:app --reload "
    networks:
      - app-network

  project-service:
    build: ./project_service
    container_name: project_service_app
    env_file: ./project_service/.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@system_db:5432/final
      - FLASK_APP=run.py
      - FLASK_DEBUG=1
      - USER_SERVICE_URL=http://user-service:8000
    depends_on:
      system_db:
        condition: service_healthy
    ports:
      - "8002:8000"
    volumes:
      - ./project_service:/app
    command: >
      sh -c " flask db upgrade &&  gunicorn -w 2 -b 0.0.0.0:8000 run:app --reload "
    networks:
      - app-network

  test-runner-service:
    build: ./self_healing_services
    container_name: test_runner_app
    environment:
      - DB_HOST=system_db
      - DB_USER=app_user
      - DB_PASSWORD=app_password
      - HEALENIUM_HOST=http://healenium:7878
      - SELENIUM_HOST=http://hlm-proxy:8085/wd/hub
    depends_on:
      system_db:
        condition: service_healthy
    ports:
      - "8003:8000"
    volumes:
      - ./self_healing_services:/app
    networks:
      - app-network

  knowledge-base-service:
    build: ./knowledge_base_service
    container_name: kb_service_app
    env_file: ./knowledge_base_service/.env
    environment:
      - DATABASE_URL=postgresql://app_user:app_password@system_db:5432/final
      - FLASK_APP=run.py
      - FLASK_DEBUG=1
    depends_on:
      system_db:
        condition: service_healthy
    ports:
      - "8004:8000"
    volumes:
      - ./knowledge_base_service:/app
    command: gunicorn -w 2 -b 0.0.0.0:8000 run:app --reload
    networks:
      - app-network
  test-runner-service:
    build: ./self_healing_services
    container_name: test_runner_app
    environment:
      - DB_HOST=system_db
      - DB_USER=app_user
      - DB_PASSWORD=app_password
      - HEALENIUM_HOST=http://healenium-backend:7878
      - SELENIUM_HOST=http://selenium-hub:4444/wd/hub
    depends_on:
      system_db:
        condition: service_healthy
    ports:
      - "8003:8000"
    volumes:
      - ./self_healing_services:/app
    networks:
      - app-network
  # ============================================================
  # 3. HEALENIUM CORE GROUP
  # ============================================================
  healenium:
    image: healenium/hlm-backend:3.4.10
    container_name: healenium
    restart: on-failure
    depends_on:
      system_db:
        condition: service_healthy
    ports:
      - "7878:7878"
    environment:
      # 👉 Dùng DB final, schema healenium
      - SPRING_DATASOURCE_URL=jdbc:postgresql://system_db:5432/final?currentSchema=healenium
      - SPRING_DATASOURCE_USERNAME=healenium_user
      - SPRING_DATASOURCE_PASSWORD=YDk2nmNs4s9aCP6K
      - SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA=healenium
      - SPRING_LIQUIBASE_DEFAULT_SCHEMA=healenium

      - SERVER_PORT=7878
      - KEY_SELECTOR_URL=false
      - COLLECT_METRICS=true
      - FIND_ELEMENTS_AUTO_HEALING=false
      - HLM_LOG_LEVEL=info
      - TZ=Asia/Bangkok
    volumes:
      - ./screenshots/:/screenshots
      - ./logs/:/logs
    networks:
      - app-network

  selector-imitator:
    image: healenium/hlm-selector-imitator:1.6
    container_name: selector-imitator
    restart: on-failure
    networks:
      - app-network

  hlm-proxy:
    image: healenium/hlm-proxy:2.1.9
    container_name: hlm-proxy
    restart: on-failure
    ports:
      - "8085:8085"
    environment:
      - RECOVERY_TRIES=1
      - SCORE_CAP=.6
      - HEAL_ENABLED=true
      - SELENIUM_SERVER_URL=http://selenium-hub:4444/wd/hub
      - HEALENIUM_SERVER_URL=http://healenium:7878
      - HEALENIUM_SERVICE=http://healenium:7878
      - IMITATE_SERVICE=http://selector-imitator:8000
      - HLM_LOG_LEVEL=debug
      - TZ=Asia/Bangkok
    depends_on:
      selenium-hub:
        condition: service_started
      healenium:
        condition: service_started
    networks:
      - app-network

  # ============================================================
  # 4. SELENIUM GRID
  # ============================================================
  selenium-hub:
    image: selenium/hub:latest
    container_name: selenium-hub
    restart: on-failure
    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"
    networks:
      - app-network

  chrome:
    image: selenium/node-chrome:latest
    container_name: node-chrome
    restart: on-failure
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_INSTANCES=5
      - SE_NODE_MAX_SESSIONS=5
      - TZ=Asia/Bangkok
    networks:
      - app-network

  edge:
    image: selenium/node-edge:latest
    container_name: node-edge
    shm_size: 2gb
    restart: on-failure
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - TZ=Asia/Bangkok
    networks:
      - app-network

  firefox:
    image: selenium/node-firefox:latest
    container_name: node-firefox
    restart: on-failure
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - TZ=Asia/Bangkok
    networks:
      - app-network

# ============================================================
# NETWORKS & VOLUMES
# ============================================================
networks:
  app-network:
    driver: bridge

volumes:
  pgdata_shared:
