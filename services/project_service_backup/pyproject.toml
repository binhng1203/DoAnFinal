[tool.poetry]
name = "project-service"
version = "0.1.0"
description = "Project Service quản lý dự án và test cases"
authors = ["Your Name"]
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
Django = "^5.0"
djangorestframework = "^3.15"
psycopg2-binary = "^2.9"
django-environ = "^0.11"
gunicorn = "^22.0"
# project-service không cần simplejwt nếu chỉ xác thực qua Gateway hoặc check token thủ công,
# nhưng tạm thời cứ add để dùng các utility nếu cần.
djangorestframework-simplejwt = "^5.5.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"